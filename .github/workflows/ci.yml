name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goboilerplate
          POSTGRES_PASSWORD: goboilerplate
          POSTGRES_DB: goboilerplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goboilerplate -d goboilerplate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      POSTGRES_CONNECTION: postgres://goboilerplate:goboilerplate@localhost:5432/goboilerplate?sslmode=disable
      BEARER_SECRET: dev-secret-key-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: emails/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install golang.org/x/tools/cmd/deadcode@latest
          python -m pip install --upgrade pip
          pip install semgrep
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Install email workspace
        run: make emails-install

      - name: Run migrations
        run: make db-migrate

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: AI quality gates
        run: make ai-check
