run:
  timeout: 5m
  tests: false

linters:
  enable:
    - gocyclo
    - funlen
    - gocognit
    - govet
    - errcheck
    - staticcheck

linters-settings:
  funlen:
    lines: 80
    statements: 50
  gocyclo:
    min-complexity: 15
  gocognit:
    min-complexity: 20

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - gocyclo
