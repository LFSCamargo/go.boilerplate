# Local development: Postgres, Mailhog, API (:5000) + nginx (:8080).
name: goboilerplate-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goboilerplate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goboilerplate}
      POSTGRES_DB: ${POSTGRES_DB:-goboilerplate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - goboilerplate

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - goboilerplate

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    stop_grace_period: 2s
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
      POSTGRES_CONNECTION: postgres://${POSTGRES_USER:-goboilerplate}:${POSTGRES_PASSWORD:-goboilerplate}@postgres:5432/${POSTGRES_DB:-goboilerplate}?sslmode=disable
      BEARER_SECRET: ${BEARER_SECRET:-dev-secret-key-at-least-32-characters-long}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
      MAIL_FROM: ${MAIL_FROM:-noreply@go.boilerplate}
      EMAILS_DIR: emails
      EMAIL_ASSETS_BASE_URL: ${EMAIL_ASSETS_BASE_URL:-http://localhost:8080}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      UPLOADS_DIR: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      CGO_ENABLED: "0"
    volumes:
      - .:/app
      - /app/tmp
      - emails_node_modules:/app/emails/node_modules
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - goboilerplate

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - goboilerplate

volumes:
  postgres_data:
  emails_node_modules:
  go_mod_cache:
  go_build_cache:

networks:
  goboilerplate:
