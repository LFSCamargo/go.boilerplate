root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./src"
  delay = 500
  exclude_dir = ["tmp", "vendor", "emails", "uploads", ".git", ".cursor", ".claude", ".codex"]
  exclude_regex = ["_test\\.go"]
  include_dir = ["src", "cmd"]
  include_ext = ["go"]
  include_file = ["go.mod", "go.sum"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true
  poll = true
  poll_interval = 500

[log]
  time = true

[color]
  main = "cyan"
  watcher = "blue"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
