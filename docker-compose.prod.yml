# Production-like stack: Postgres + API (:5000) + nginx (:8080).
name: goboilerplate-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goboilerplate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goboilerplate}
      POSTGRES_DB: ${POSTGRES_DB:-goboilerplate}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - goboilerplate

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
      POSTGRES_CONNECTION: postgres://${POSTGRES_USER:-goboilerplate}:${POSTGRES_PASSWORD:-goboilerplate}@postgres:5432/${POSTGRES_DB:-goboilerplate}?sslmode=disable
      BEARER_SECRET: ${BEARER_SECRET:?set BEARER_SECRET (min 32 chars) in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      EMAILS_DIR: emails
      EMAIL_ASSETS_BASE_URL: ${EMAIL_ASSETS_BASE_URL:?set EMAIL_ASSETS_BASE_URL in .env}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?set APP_PUBLIC_URL in .env}
      UPLOADS_DIR: /app/uploads
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - goboilerplate

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - goboilerplate

volumes:
  postgres_data:
  uploads_data:

networks:
  goboilerplate:
